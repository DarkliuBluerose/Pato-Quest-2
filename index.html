label{display:block;font-weight:700;margin:12px 0 4px}
.coin{font-family:Fredoka,Nunito,system-ui,sans-serif;font-size:22px;white-space:nowrap}
.shop{display:flex;gap:14px;align-items:center}.shop>div:last-child{flex:1}
.th{width:96px;flex:none}.th svg{width:100%;height:auto}
button:disabled{opacity:.6;cursor:default}
nav{gap:4px}

const COLS=7,ROWS=8;let G=null,raf=0;
function hud(){const e=$('#gs');if(!e||!G)return;const h=(st.hi&&st.hi[G.type])||0;e.textContent=G.type==='road'?`Cruces: ${G.s} · Récord: ${h}`:`Pan: ${G.s} · ⏱ ${Math.max(0,Math.ceil(G.t))} s · Récord: ${h}`}
function end(){G.over=true;st.hi=st.hi||{};const k=G.type,nr=G.s>(st.hi[k]||0);if(nr){st.hi[k]=G.s;save()}hud();$('#ov').innerHTML=`<div class='card' style='text-align:center;margin-top:12px'><h3>${k==='road'?'¡Te atropellaron! 🚗':'¡Se acabó el tiempo! ⏱'}</h3><p>Puntos: <b>${G.s}</b>${nr?' · ¡Nuevo récord!':''}</p><button class='go' data-a='play' data-v='${k}'>Jugar otra vez</button></div>`}
function put(){const d=$('#dk');if(!d)return;d.style.left=G.dc/COLS*100+'%';d.style.top=G.dr*12.5+'%'}
function act(d){
 if(G.type==='road'){G.dc=Math.max(0,Math.min(COLS-1,G.dc+(d==='l'?-1:d==='r'?1:0)));G.dr=Math.max(0,Math.min(ROWS-1,G.dr+(d==='u'?-1:d==='d'?1:0)));if(G.dr===0){G.s++;G.sp*=1.12;G.dc=3;G.dr=7;hud()}}
 else if(d==='l'||d==='r')G.dc=Math.max(0,Math.min(COLS-1,G.dc+(d==='l'?-1:1)));
 put()}
function startGame(){
 const A=$('#arena');if(!A||!G)return;
 const t=G.type;let bg='';
 if(t==='road'){for(let r=0;r<ROWS;r++)bg+=`<div style='position:absolute;left:0;right:0;top:${r*12.5}%;height:12.5%;background:${r===0?'#7CC6E8':r===7?'#8CCB6B':'#4A4F57'};${r>0&&r<7?'border-bottom:3px dashed #ffffff55':''}'></div>`}
 else bg="<div style='position:absolute;inset:0;background:linear-gradient(#BFE6F5 0%,#E8F6EC 70%,#8CCB6B 70%)'></div>";
 A.innerHTML=bg+`<div class='dk' id='dk'>${duck(lv(st.xp).l)}</div>`;
 Object.assign(G,{dc:3,dr:7,s:0,over:false,last:performance.now(),el:[],acc:0,t:30,sp:1});put();
 if(t==='road'){for(let r=1;r<=6;r++){const d=r%2?1:-1,v=(.9+Math.random()*.7)*d;for(let k=0;k<2;k++){const el=document.createElement('div');el.className='sp';el.textContent=['🚗','🚕','🚌','🚙'][(r+k)%4];el.style.top=r*12.5+'%';if(d>0)el.style.transform='scaleX(-1)';A.appendChild(el);G.el.push({r,x:k*3.5+Math.random()*2,v,el})}}}
 hud();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);
}
function loop(now){
 if(!G||tab!=='rec'||!$('#arena')){raf=0;return}
 const dt=Math.min(.05,(now-G.last)/1000);G.last=now;
 if(G.type==='road'){
  for(const c of G.el){c.x+=c.v*G.sp*dt;if(c.v>0&&c.x>COLS+1)c.x=-2;if(c.v<0&&c.x<-2)c.x=COLS+1;c.el.style.left=c.x/COLS*100+'%';
   if(G.dr>=1&&G.dr<=6&&c.r===G.dr&&Math.abs(c.x-G.dc)<.7){end();return}}
 }else{
  const A=$('#arena');G.t-=dt;G.acc+=dt;
  if(G.acc>.7){G.acc=0;const k=Math.random()<.25?'🪨':'🍞',c=Math.floor(Math.random()*COLS),el=document.createElement('div');el.className='sp';el.textContent=k;el.style.left=c/COLS*100+'%';el.style.top='-12.5%';A.appendChild(el);G.el.push({c,y:-1,k,el})}
  for(const o of G.el.slice()){o.y+=(3+(30-G.t)*.08)*dt;o.el.style.top=o.y*12.5+'%';
   if(o.y>=6.5&&o.y<=7.5&&o.c===G.dc){G.s=Math.max(0,G.s+(o.k==='🍞'?1:-2));o.el.remove();G.el.splice(G.el.indexOf(o),1)}
   else if(o.y>8){o.el.remove();G.el.splice(G.el.indexOf(o),1)}}
  hud();if(G.t<=0){end();return}
 }
 raf=requestAnimationFrame(loop);
}
const ptr=e=>{if(!G||G.over)return;const b=e.target.closest('[data-g]');
 if(b&&e.type==='pointerdown'){e.preventDefault();act(b.dataset.g);return}
 const a=e.target.closest('#arena');
 if(a&&G.type==='crumbs'&&(e.type==='pointerdown'||e.buttons)){const r=a.getBoundingClientRect();G.dc=Math.max(0,Math.min(COLS-1,Math.floor((e.clientX-r.left)/r.width*COLS)));put()}};
['pointerdown','pointermove'].forEach(n=>document.addEventListener(n,ptr));
document.addEventListener('keydown',e=>{if(tab!=='rec'||!G||G.over)return;const m={ArrowLeft:'l',a:'l',ArrowRight:'r',d:'r',ArrowUp:'u',w:'u',ArrowDown:'d',s:'d'}[e.key];if(m){e.preventDefault();act(m)}});
const sb=(typeof supabase!=='undefined'&&!SUPABASE_URL.startsWith('PEGA'))?supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
function amsg(t){$('#am').textContent=t}
async function login(up){
 if(!sb){amsg('Falta configurar Supabase en index.html.');return}
 const email=$('#em').value.trim(),password=$('#pw').value;
 if(!email||password.length<8){amsg('Escribe tu correo y una contraseña de al menos 8 caracteres.');return}
 amsg('Un momento…');
 const r=up?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});
 if(r.error){amsg(up?'No pude crear la cuenta. Prueba con otro correo o contraseña.':'Correo o contraseña incorrectos.');return}
 amsg(up&&!r.data.session?'Te enviamos un correo para confirmar tu cuenta. Después vuelve y entra.':'');
}
$('#bin').addEventListener('click',()=>login(false));$('#bup').addEventListener('click',()=>login(true));
async function loadState(){
 const D={xp:0,coins:0,own:{},eq:{},done:{},tier:{},custom:[],hi:{}};let data=null;
 try{const r=await sb.from('saves').select('state').eq('user_id',me.id).maybeSingle();net.ok=!r.error;if(r.data)data=r.data.state}catch(e){net.ok=false}
 if(!data){try{data=JSON.parse(localStorage.getItem(LS)||'null')}catch(e){}}
 Object.keys(st).forEach(k=>delete st[k]);Object.assign(st,D,data||{});
 if(!net.ok)toast('Sin conexión: no se guardará en la nube hasta recargar');
}
async function enter(ses){
 if(ses&&me&&me.id===ses.user.id)return;
 if(!ses){me=null;net.f=null;net.code='';net.ok=false;Object.keys(st).forEach(k=>delete st[k]);$('#pw').value='';document.body.className='out';return}
 me=ses.user;net.email=me.email||'';LS='patoquest-'+me.id;lastSaved='';lastDuck='';net.f=null;
 await loadState();tab='pato';G=null;document.body.className='';render();if(st.share)loadFriends();
}
async function flush(){
 ct=0;if(!me||!net.ok)return;
 const j=JSON.stringify(st);
 if(j!==lastSaved){const r=await sb.from('saves').upsert({user_id:me.id,state:st,updated_at:new Date().toISOString()});if(!r.error)lastSaved=j}
 await syncDuck();
}
function cloudSave(){if(!me||!net.ok)return;clearTimeout(ct);ct=setTimeout(flush,1200)}
function afterAct(){cloudSave()}
async function syncDuck(){
 if(!me||!st.share)return;
 const d={user_id:me.id,name:String(st.name||'Pato').slice(0,20),level:lv(st.xp).l,xp:st.xp,eq:Object.fromEntries(Object.entries(st.eq).filter(([,x])=>x))};
 const j=JSON.stringify(d);if(j===lastDuck)return;
 const r=await sb.from('ducks').upsert(d);if(!r.error)lastDuck=j;else net.err='No pude actualizar tu pato.';
}
async function loadFriends(){
 if(!me)return;
 const r=await sb.from('ducks').select('user_id,name,level,xp,eq,code');
 if(r.error){net.err='No pude leer a tus amigos.';net.f=net.f||[]}else{net.err='';net.f=r.data;const m=r.data.find(x=>x.user_id===me.id);net.code=m?m.code:''}
 const c=$('#mycode');if(c)c.textContent=net.code||'…';drawFriends();
}
async function shareNow(){await syncDuck();await loadFriends()}
async function unshareNow(){await sb.from('ducks').delete().eq('user_id',me.id);net.code='';await loadFriends()}
async function addFriend(c){
 const m=$('#fm');m.textContent='Buscando…';
 const r=await sb.rpc('add_friend',{p_code:c});
 if(r.error){const t=r.error.message||'';m.textContent=t.includes('not_found')?'No encontré ese código. Revisa que esté bien escrito y que tu amigo haya activado «Mostrar mi pato».':t.includes('self')?'Ese es tu propio código.':'No pude agregar al amigo. Intenta de nuevo.';return}
 m.textContent='¡Amigo agregado!';const i=$('#fc');if(i)i.value='';loadFriends();
}
function drawFriends(){
 const e=$('#frl');if(!e)return;
 if(net.f===null){e.innerHTML="<p class='mut'>Cargando amigos…</p>";return}
 const M={};ITEMS.forEach(i=>M[i[0]]=i);
 const rows=net.f.filter(x=>x&&typeof x.name==='string').sort((a,b)=>(+b.level||0)-(+a.level||0)).map(x=>{
  const eq={};SLOTS.forEach(k=>{const it=x.eq&&typeof x.eq==='object'?M[x.eq[k]]:null;if(it&&it[1]===k)eq[k]=it[0]});
  const worn=Object.values(eq).map(id=>M[id][2]),lvl=Math.max(1,Math.min(99,+x.level||1)),mine=x.user_id===me.id;
  return `<div class='card shop'><div class='th'>${duck(lvl,eq)}</div><div><h3>${esc(String(x.name).slice(0,20))}${mine?' (tú)':''}</h3><div class='mut'>Nivel ${lvl} · ${Math.max(0,+x.xp||0)} XP</div><div>${worn.length?'Lleva: '+worn.join(', '):'Sin ropa todavía'}</div>${mine?'':`<button data-a='delf' data-v='${esc(x.user_id)}' style='margin-top:8px'>Quitar de mis amigos</button>`}</div></div>`}).join('');
 e.innerHTML=(net.err?`<p class='tag t2'>${esc(net.err)}</p>`:'')+(rows||"<p class='mut'>Todavía no hay patos aquí. Muestra el tuyo y agrega amigos con su código.</p>")+`<button data-a='refresh' style='margin-top:6px'>Actualizar</button>`;
}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&ct){clearTimeout(ct);flush()}});
(async()=>{
 if(!sb){document.body.className='out';amsg('Falta configurar Supabase en index.html.');return}
 const{data}=await sb.auth.getSession();await enter(data.session);if(!data.session)document.body.className='out';
 sb.auth.onAuthStateChange((ev,ses)=>{if(ev==='SIGNED_OUT')enter(null);else if(ev==='SIGNED_IN')enter(ses)});
})();
</script>
</body>
</html>
